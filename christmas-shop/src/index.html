<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Christmas Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

</head>

<body>
  <header>
    <div class="header-container">
      <div class="logo">
        <img src="./assets/snowflake.svg" alt="snowflake" class="snowflake">
        <p class="action-small"> the gifts</p>
      </div>
      <div class="items-container">
        <div class="item">
          <a href="" class="action-small">gifts</a>
        </div>
        <div class="item">
          <a href="" class="action-small">about</a>
        </div>
        <div class="item">
          <a href="" class="action-small">best</a>
        </div>
        <div class="item">
          <a href="" class="action-small">contacts</a>
        </div>
      </div>
      <div class="burger desktop-only">
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>
  </header>
  <main class="main">
    <section class="hero-section">
      <img src="./assets/bg-ball.png" alt="snowball" class="snowbal-img">
      <div class="hero-container">
        <p class="caption hero">Merry Christmas</p>
        <h1 class="hero">Gift yourself the magic of new possibilities</h1>
        <button class="hero-btn">
          <a class="action-small hero">Explore Magical Gifts</a>
        </button>
        <p class="caption hero">and Happy New Year</p>
      </div>
    </section>
  </main>
  <footer>
    <div class="footer-container">
      <div class="footer-cards">
        <div class="footer-santa">
          <div class="santa-card"> <img src="./assets/santa-claus.svg" alt="santa-claus image"></div>
          <p class="action-large">+375 (29) 111-22-33</p>
          <h3 class="footer-header">Call Us</h3>
        </div>
        <div class="footer-tree">
          <div class="christmas-tree"> <img src="./assets/christmas-tree.svg" alt="christmas-tree image">
          </div>
          <p class="action-large">Magic forest</p>
          <h3 class="footer-header">meet us</h3>
        </div>
        <div class="footer-snake">
          <div class="snake-card"> <img src="./assets/snake.svg" alt="snake image"></div>
          <p class="action-large">gifts@magic.com</p>
          <h3 class="footer-header">write us</h3>
        </div>
      </div>
      <div class="footer-socials">
        <div class="socials-container">
          <div class="social-card">
            <img src="./assets/telegram.svg" alt="telegram icon">
          </div>
          <div class="social-card">
            <img src="./assets/facebook.svg" alt="facebook icon">
          </div>
          <div class="social-card">
            <img src="./assets/instagram.svg" alt="instagram icon">
          </div>
          <div class="social-card">
            <img src="./assets/X.svg" alt="x icon">
          </div>
        </div>
        <p class="footer-p copyright">© Copyright 2025, All Rights Reserved</p>
        <p class="caption footer-p">Made in Rolling Scopes School</p>
      </div>
    </div>
  </footer>
</body>

</html>
